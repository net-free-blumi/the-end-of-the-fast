<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#042f2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="115" fill="url(#grad1)"/>
  
  <!-- Outer glowing accent ring -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Glowing Star / Sparkle in background -->
  <circle cx="380" cy="130" r="18" fill="#fef08a" opacity="0.9" filter="url(#shadow)"/>
  <path d="M 380 100 L 385 125 L 410 130 L 385 135 L 380 160 L 375 135 L 350 130 L 375 125 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="120" cy="380" r="8" fill="#2dd4bf" opacity="0.8"/>

  <!-- Crescent Moon Symbol (Represents evening / fast end / Tzeit HaKochavim) -->
  <path d="M 340 180 A 130 130 0 1 1 200 370 A 100 100 0 1 0 340 180 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- Hourglass / Fast Timer in Foreground -->
  <g transform="translate(190, 160) scale(0.95)" filter="url(#shadow)">
    <!-- Hourglass Frame Top and Bottom Bars -->
    <rect x="-40" y="-10" width="160" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="-40" y="194" width="160" height="16" rx="8" fill="#e2e8f0"/>
    
    <!-- Hourglass Glass Body -->
    <path d="M -20 6 Q 40 80 40 100 Q 40 120 -20 194 L 100 194 Q 40 120 40 100 Q 40 80 100 6 Z" fill="url(#glowGrad)" stroke="#cbd5e1" stroke-width="4"/>
    
    <!-- Sand Top (falling) -->
    <path d="M -8 18 L 88 18 Q 40 70 40 96 Z" fill="url(#goldGrad)"/>
    
    <!-- Sand Stream -->
    <line x1="40" y1="96" x2="40" y2="150" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Sand Bottom (accumulating) -->
    <path d="M 5 186 Q 40 145 75 186 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
